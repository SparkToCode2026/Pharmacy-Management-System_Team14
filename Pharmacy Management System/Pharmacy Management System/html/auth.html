<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharmacy Management System - Auth</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #f4f6f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .auth-toggle-btn {
        cursor: pointer;
        color: #0d6efd;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card auth-card p-4">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">💊 Pharmacy System</h3>
        <p class="text-muted small" id="authSubtitle">
          Welcome back! Sign in to continue.
        </p>
      </div>

      <!-- Alert Message Area -->
      <div id="authAlert" class="alert d-none" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label fw-semibold"
            >Email or Username</label
          >
          <input
            type="text"
            class="form-control"
            id="loginEmail"
            placeholder="Enter username or email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label fw-semibold"
            >Password</label
          >
          <input
            type="password"
            class="form-control"
            id="loginPassword"
            placeholder="••••••••"
            required
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary w-100 py-2 mt-2 fw-semibold"
        >
          Sign In
        </button>
      </form>

      <!-- Registration Form (POST /User/register) -->
      <form id="registerForm" class="d-none">
        <div class="mb-3">
          <label for="regUsername" class="form-label fw-semibold"
            >Username</label
          >
          <input
            type="text"
            class="form-control"
            id="regUsername"
            placeholder="johndoe"
            required
          />
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label fw-semibold"
            >Email Address</label
          >
          <input
            type="email"
            class="form-control"
            id="regEmail"
            placeholder="name@pharmacy.com"
            required
          />
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label fw-semibold"
            >Password</label
          >
          <input
            type="password"
            class="form-control"
            id="regPassword"
            placeholder="••••••••"
            required
            minlength="6"
          />
        </div>

        <button
          type="submit"
          class="btn btn-success w-100 py-2 mt-2 fw-semibold"
        >
          Create Account
        </button>
      </form>

      <!-- Toggle Link -->
      <div class="text-center mt-4">
        <span id="toggleText" class="text-muted small"
          >Don't have an account?
        </span>
        <span id="toggleAuthBtn" class="auth-toggle-btn small fw-semibold"
          >Register here</span
        >
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth Script -->
    <script src="auth.js"></script>
  </body>
</html>
