<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments - Pharmacy Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
              <div class="card mb-4">
        <div class="card-header">
          <h3 class="mb-0">Register New Payment</h3>
        </div>
        <div class="card-body">
          <form id="paymentForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="paymentAmount" class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" id="paymentAmount" placeholder="24.99 OMR">
              </div>
              <div class="col-md-6">
                <label for="paymentDate" class="form-label">Payment Date</label>
                <input type="date" class="form-control" id="paymentDate">
              </div>
              <div class="col-md-6">
                <label for="paymentMethod" class="form-label">Payment Method</label>
                <select class="form-select" id="paymentMethod">
                  <option value="Cash">Cash</option>
                  <option value="CreditCard">Credit Card</option>
                  <option value="DebitCard">Debit Card</option>
                  <option value="Insurance">Insurance</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="paymentStatus" class="form-label">Payment Status</label>
                <select class="form-select" id="paymentStatus">
                  <option value="Pending">Pending</option>
                  <option value="Completed">Completed</option>
                  <option value="Failed">Failed</option>
                  <option value="Refunded">Refunded</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="orderId" class="form-label">Order ID</label>
                <input type="number" class="form-control" id="orderId" placeholder="101">
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Add Payment</button>
          </form>
        </div>
      </div>
      <div class="card mb-5">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Payment List</h3>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshPayments">Refresh</button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Payment ID</th>
                  <th>Amount</th>
                  <th>Payment Date</th>
                  <th>Payment Method</th>
                  <th>Payment Status</th>
                  <th>Order ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="paymentTableBody">
                <tr>
                  <td>1</td>
                  <td>$24.99</td>
                  <td>2026-08-01</td>
                  <td>Credit Card</td>
                  <td><span class="badge bg-success">Completed</span></td>
                  <td>101</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
                <tr>
                  <td>2</td>
                  <td>$12.50</td>
                  <td>2026-08-03</td>
                  <td>Cash</td>
                  <td><span class="badge bg-warning text-dark">Pending</span></td>
                  <td>102</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
                <tr>
                  <td>3</td>
                  <td>$8.00</td>
                  <td>2026-07-28</td>
                  <td>Insurance</td>
                  <td><span class="badge bg-danger">Failed</span></td>
                  <td>103</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
   <div id="footer-placeholder"></div>
   
<div class="modal fade" id="editPaymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editPaymentForm">
        <div class="modal-header">
          <h5 class="modal-title">Edit Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editPaymentId">
          <div class="mb-3">
            <label for="editPaymentAmount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="editPaymentAmount">
          </div>
          <div class="mb-3">
            <label for="editPaymentDate" class="form-label">Payment Date</label>
            <input type="date" class="form-control" id="editPaymentDate">
          </div>
          <div class="mb-3">
            <label for="editPaymentMethod" class="form-label">Payment Method</label>
            <select class="form-select" id="editPaymentMethod">
              <option value="Cash">Cash</option>
              <option value="CreditCard">Credit Card</option>
              <option value="DebitCard">Debit Card</option>
              <option value="Insurance">Insurance</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    fetch('footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
