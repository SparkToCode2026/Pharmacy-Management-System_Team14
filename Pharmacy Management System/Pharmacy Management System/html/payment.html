<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments - Pharmacy Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">
              <div class="card mb-4">
        <div class="card-header">
          <h3 class="mb-0">Register New Payment</h3>
        </div>
        <div class="card-body">
          <form id="paymentForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="paymentAmount" class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" id="paymentAmount" placeholder="e.g. 24.99">
              </div>
              <div class="col-md-6">
                <label for="paymentDate" class="form-label">Payment Date</label>
                <input type="date" class="form-control" id="paymentDate">
              </div>
              <div class="col-md-6">
                <label for="paymentMethod" class="form-label">Payment Method</label>
                <select class="form-select" id="paymentMethod">
                  <option value="Cash">Cash</option>
                  <option value="CreditCard">Credit Card</option>
                  <option value="DebitCard">Debit Card</option>
                  <option value="Insurance">Insurance</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="paymentStatus" class="form-label">Payment Status</label>
                <select class="form-select" id="paymentStatus">
                  <option value="Pending">Pending</option>
                  <option value="Completed">Completed</option>
                  <option value="Failed">Failed</option>
                  <option value="Refunded">Refunded</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="orderId" class="form-label">Order ID</label>
                <input type="number" class="form-control" id="orderId" placeholder="e.g. 101">
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Add Payment</button>
          </form>
        </div>
      </div>

    </div>
  </main>
    </div>
  </main>

</body>
</html>
