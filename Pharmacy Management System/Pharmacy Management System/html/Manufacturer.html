<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manufacturer Management - Pharmacy System</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
      <!-- Header -->
      <div class="row align-items-center mb-4">
        <div class="col-md-6">
          <h2 class="fw-bold text-primary mb-0">Manufacturer Management</h2>
          <p class="text-muted small mb-0">
            Maintain and coordinate with registered pharmaceutical manufacturers
          </p>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
          <button
            class="btn btn-success shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#createModal"
          >
            + Create Manufacturer
          </button>
        </div>
      </div>

      <!-- Search & Filter Controls -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
          <div class="row g-2">
            <div class="col-md-8">
              <div class="input-group">
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search manufacturer by name or license..."
                />
                <button class="btn btn-primary" id="searchBtn">Search</button>
                <button
                  class="btn btn-outline-secondary"
                  id="clearSearchBtn"
                  onclick="clearManufacturerSearch()"
                >
                  Clear
                </button>
              </div>
            </div>
            <div class="col-md-4 text-md-end">
              <button
                class="btn btn-outline-primary"
                onclick="sortManufacturers()"
              >
                Sort by Name (A-Z)
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Table Card -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Manufacturer Name</th>
                  <th scope="col">License Number</th>
                  <th scope="col">Contact Number</th>
                  <th scope="col">Contact Email</th>
                  <th scope="col" class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="manufacturersTableBody">
                <!-- Populated dynamically via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- CREATE MODAL -->
    <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold">Create Manufacturer</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="createForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label for="createName" class="form-label fw-bold"
                  >Manufacturer Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="createName"
                  class="form-control"
                  placeholder="e.g. Pfizer, Novartis"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="createLicense" class="form-label fw-bold"
                  >License Number <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="createLicense"
                  class="form-control"
                  placeholder="e.g. LIC-98765"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="createContactNumber" class="form-label fw-bold"
                  >Contact Number <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="createContactNumber"
                  class="form-control"
                  placeholder="e.g. +1 555-456-7890"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="createContactEmail" class="form-label fw-bold"
                  >Contact Email <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  id="createContactEmail"
                  class="form-control"
                  placeholder="contact@manufacturer.com"
                  required
                />
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-success">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title fw-bold">Edit Manufacturer</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="editForm">
            <div class="modal-body p-4">
              <input type="hidden" id="editId" />
              <div class="mb-3">
                <label for="editName" class="form-label fw-bold"
                  >Manufacturer Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="editName"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editLicense" class="form-label fw-bold"
                  >License Number <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="editLicense"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editContactNumber" class="form-label fw-bold"
                  >Contact Number <span class="text-danger">*</span></label
                >
                <div class="input-group">
                  <input
                    type="text"
                    id="editContactNumber"
                    class="form-control"
                    required
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="patchContactInfo()"
                  >
                    Patch Phone
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <label for="editContactEmail" class="form-label fw-bold"
                  >Contact Email <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  id="editContactEmail"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-warning">
                Update Manufacturer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- DETAILS MODAL -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title fw-bold">Manufacturer Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <p><strong>ID:</strong> <span id="detailId"></span></p>
            <p><strong>Name:</strong> <span id="detailName"></span></p>
            <p><strong>License Number:</strong> <span id="detailLicense"></span></p>
            <p><strong>Contact Number:</strong> <span id="detailContactNumber"></span></p>
            <p><strong>Contact Email:</strong> <span id="detailContactEmail"></span></p>
          </div>
          <div class="modal-footer bg-light">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS, API, Navbar, Page Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="Manufacturer.js"></script>
  </body>
</html>
