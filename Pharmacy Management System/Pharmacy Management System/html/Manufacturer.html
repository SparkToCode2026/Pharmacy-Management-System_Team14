<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manufacturer Management</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Area -->
    <main class="container my-5">
      <h2 class="mb-4 text-primary">Manufacturer Management</h2>

      <!-- Register New Manufacturer Form Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Register New Manufacturer</h5>
        </div>
        <div class="card-body">
          <form id="addManufacturerForm">
            <div class="row g-3">
              <!-- Name -->
              <div class="col-md-3">
                <label for="manufacturerName" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="manufacturerName"
                  placeholder="Enter name"
                  required
                />
              </div>

              <!-- Email -->
              <div class="col-md-3">
                <label for="manufacturerEmail" class="form-label"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="manufacturerEmail"
                  placeholder="contact@company.com"
                  required
                />
              </div>

              <!-- Phone -->
              <div class="col-md-3">
                <label for="manufacturerPhone" class="form-label">Phone</label>
                <input
                  type="text"
                  class="form-control"
                  id="manufacturerPhone"
                  placeholder="+123456789"
                />
              </div>

              <!-- License Number -->
              <div class="col-md-3">
                <label for="manufacturerLicense" class="form-label"
                  >License Number</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="manufacturerLicense"
                  placeholder="LIC-12345"
                />
              </div>
            </div>

            <button type="submit" class="btn btn-success mt-3">
              Add Manufacturer
            </button>
          </form>
        </div>
      </div>

      <!-- Registered Manufacturers Table Card -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Registered Manufacturers</h5>
          <div class="d-flex gap-2">
            <button id="sortBtn" class="btn btn-sm btn-light">
              Sort by ID
            </button>
            <button id="refreshBtn" class="btn btn-sm btn-light">
              Refresh
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Search Control with Search Button -->
          <div class="row mb-3">
            <div class="col-md-5 ms-auto">
              <div class="input-group">
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search by name or email..."
                />
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th style="width: 8%">ID</th>
                  <th style="width: 20%">Name</th>
                  <th style="width: 22%">Email</th>
                  <th style="width: 15%">Phone</th>
                  <th style="width: 18%">License Number</th>
                  <th style="width: 17%" class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="manufacturersTableBody">
                <!-- Dynamically populated rows -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Edit Manufacturer Modal -->
    <div
      class="modal fade"
      id="editManufacturerModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title">Edit Manufacturer</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="editManufacturerForm">
            <div class="modal-body">
              <input type="hidden" id="editManufacturerId" />

              <div class="mb-3">
                <label for="editManufacturerName" class="form-label"
                  >Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editManufacturerName"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editManufacturerEmail" class="form-label"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="editManufacturerEmail"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editManufacturerPhone" class="form-label"
                  >Phone</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editManufacturerPhone"
                />
              </div>

              <div class="mb-3">
                <label for="editManufacturerLicense" class="form-label"
                  >License Number</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editManufacturerLicense"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Manufacturer Details Modal -->
    <div
      class="modal fade"
      id="manufacturerDetailsModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title">Manufacturer Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>ID:</strong> <span id="detailId"></span></p>
            <p><strong>Name:</strong> <span id="detailName"></span></p>
            <p><strong>Email:</strong> <span id="detailEmail"></span></p>
            <p><strong>Phone:</strong> <span id="detailPhone"></span></p>
            <p><strong>License:</strong> <span id="detailLicense"></span></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script>
      fetch("navbar.html")
        .then((r) => r.text())
        .then(
          (d) => (document.getElementById("navbar-placeholder").innerHTML = d),
        )
        .catch(() => {});

      fetch("footer.html")
        .then((r) => r.text())
        .then(
          (d) => (document.getElementById("footer-placeholder").innerHTML = d),
        )
        .catch(() => {});
    </script>

    <!-- Bootstrap JS & Local JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Manufacturer.js"></script>
  </body>
</html>
