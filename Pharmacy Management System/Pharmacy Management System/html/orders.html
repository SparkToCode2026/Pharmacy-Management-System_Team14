<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <h1 class="text-primary mb-4">Order Management</h1>

    <!-- Create New Order -->
    <div class="card shadow mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Create New Order</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Customer (User)</label>
                    <select id="orderUser" class="form-select"><option value="">Loading…</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Branch</label>
                    <select id="orderBranch" class="form-select"><option value="">Loading…</option></select>
                </div>
            </div>

            <hr class="my-4">

            <h6 class="text-secondary mb-3">Order Items</h6>
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Medicine</label>
                    <select id="itemMedicine" class="form-select"><option value="">Loading…</option></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quantity</label>
                    <input id="itemQty" type="number" min="1" value="1" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Unit Price</label>
                    <input id="itemPrice" type="number" min="0" step="0.01" class="form-control">
                </div>
                <div class="col-md-2">
                    <button type="button" id="addItemBtn" class="btn btn-outline-primary w-100">Add item</button>
                </div>
            </div>

            <table class="table table-sm mt-3">
                <thead>
                    <tr><th>Medicine</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody id="newItemsBody">
                    <tr><td colspan="5" class="text-center text-muted">No items added yet.</td></tr>
                </tbody>
                <tfoot>
                    <tr><th colspan="3" class="text-end">Total</th><th id="newItemsTotal">0.00</th><th></th></tr>
                </tfoot>
            </table>

            <button type="button" id="createOrderBtn" class="btn btn-success mt-2">Place Order</button>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select id="filterStatus" class="form-select">
                        <option value="">All</option>
                        <option>Pending</option>
                        <option>Confirmed</option>
                        <option>Preparing</option>
                        <option>Ready</option>
                        <option>Completed</option>
                        <option>Cancelled</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">From date</label>
                    <input id="filterFrom" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">To date</label>
                    <input id="filterTo" type="date" class="form-control">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button id="applyFilterBtn" class="btn btn-primary w-100">Filter</button>
                    <button id="clearFilterBtn" class="btn btn-outline-secondary w-100">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Orders Table -->
    <div class="card shadow">
        <div class="card-header bg-secondary text-white d-flex justify-content-between">
            <h5 class="mb-0">Orders</h5>
            <button id="refreshBtn" class="btn btn-light btn-sm">Refresh</button>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th><th>Date</th><th>User Id</th><th>Branch Id</th>
                        <th>Total</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="7" class="text-center">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Sales Summary -->
    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Sales Summary</h5>
        </div>
        <div class="card-body" id="salesSummary">
            <span class="text-muted">Loading…</span>
        </div>
    </div>
</div>

<!-- Edit Order Modal -->
<div class="modal fade" id="editOrderModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Edit Order</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editOrderId">
            <div class="mb-3">
                <label class="form-label">Customer (User Id)</label>
                <input id="editOrderUserId" type="number" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Order Date</label>
                <input id="editOrderDate" type="datetime-local" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="saveEditBtn" class="btn btn-primary">Save changes</button>
        </div>
    </div></div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    fetch("navbar.html").then(r => r.text()).then(d => document.getElementById("navbar-placeholder").innerHTML = d);
    fetch("footer.html").then(r => r.text()).then(d => document.getElementById("footer-placeholder").innerHTML = d);
</script>
<script src="Order.js"></script>
</body>
</html>
