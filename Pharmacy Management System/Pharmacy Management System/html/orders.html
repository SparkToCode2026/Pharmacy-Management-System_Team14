<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders Management - Pharmacy System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Dynamic Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <main class="container my-5">
      <h2 class="mb-4 text-primary">Order Management</h2>

      <!-- Create Order Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Create New Order</h5>
        </div>
        <div class="card-body">
          <form id="createOrderForm" onsubmit="return false;">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Branch <span class="text-danger">*</span></label>
                <select id="orderBranch" class="form-select" required>
                  <option value="">— select branch —</option>
                </select>
              </div>
            </div>

            <!-- Line Items Builder -->
            <div class="card bg-light border-0 p-3 mb-3">
              <h6 class="fw-bold text-secondary mb-3">Add Medicine Line Items</h6>
              <div class="row g-2 align-items-end">
                <div class="col-md-5">
                  <label class="form-label small">Select Medicine</label>
                  <select id="itemMedicine" class="form-select">
                    <option value="">— select —</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small">Quantity</label>
                  <input
                    type="number"
                    id="itemQty"
                    class="form-control"
                    value="1"
                    min="1"
                  />
                </div>
                <div class="col-md-2">
                  <label class="form-label small">Unit Price (OMR)</label>
                  <input
                    type="number"
                    id="itemPrice"
                    step="0.01"
                    class="form-control"
                    placeholder="0.00"
                    readonly
                  />
                </div>
                <div class="col-md-2">
                  <button type="button" id="addItemBtn" class="btn btn-primary w-100">
                    + Add
                  </button>
                </div>
              </div>

              <!-- Added Items Preview Table -->
              <div class="table-responsive mt-3">
                <table class="table table-sm table-bordered bg-white mb-0">
                  <thead class="table-secondary">
                    <tr>
                      <th>Medicine</th>
                      <th style="width: 15%">Qty</th>
                      <th style="width: 20%">Price</th>
                      <th style="width: 20%">Subtotal</th>
                      <th style="width: 10%">Action</th>
                    </tr>
                  </thead>
                  <tbody id="newItemsBody">
                    <tr>
                      <td colspan="5" class="text-center text-muted">No items added yet.</td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr class="fw-bold">
                      <td colspan="3" class="text-end">Order Total:</td>
                      <td id="newItemsTotal">0.00 OMR</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            <button type="button" id="createOrderBtn" class="btn btn-success px-4">
              Place Order
            </button>
          </form>
        </div>
      </div>

      <!-- Sales Summary Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white">
          <h5 class="card-title mb-0">Sales Analytics Summary</h5>
        </div>
        <div class="card-body" id="salesSummary">
          <div class="text-center text-muted py-2">Loading sales data...</div>
        </div>
      </div>

      <!-- Orders List Card -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <h5 class="card-title mb-0">Registered Orders</h5>
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <select id="filterStatus" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Preparing">Preparing</option>
              <option value="Ready">Ready</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
            <input type="date" id="filterFrom" class="form-control form-control-sm" style="width: auto;" title="From Date" />
            <input type="date" id="filterTo" class="form-control form-control-sm" style="width: auto;" title="To Date" />
            <button id="applyFilterBtn" class="btn btn-sm btn-light">Filter</button>
            <button id="clearFilterBtn" class="btn btn-sm btn-outline-light">Clear</button>
            <button id="refreshBtn" class="btn btn-sm btn-light">Refresh</button>
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Date</th>
                  <th>User ID</th>
                  <th>Branch ID</th>
                  <th>Total Amount</th>
                  <th>Status</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody">
                <tr>
                  <td colspan="7" class="text-center">Loading orders...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Edit Order Modal -->
    <div class="modal fade" id="editOrderModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning">
            <h5 class="modal-title fw-bold">Edit Order</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editOrderId" />
            <div class="mb-3">
              <label class="form-label fw-bold">User ID</label>
              <input type="number" id="editUserId" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Branch ID</label>
              <input type="number" id="editBranchId" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Total Amount (OMR)</label>
              <input type="number" step="0.01" id="editTotalAmount" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Status</label>
              <select id="editStatusSelect" class="form-select">
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Preparing">Preparing</option>
                <option value="Ready">Ready</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="saveEditBtn" class="btn btn-primary">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS, API, Navbar, Order JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="Order.js"></script>
  </body>
</html>
