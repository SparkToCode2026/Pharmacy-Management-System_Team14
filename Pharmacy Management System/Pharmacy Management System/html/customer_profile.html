<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile - Pharmacy System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
      <!-- 1. Add New Profile Section (Shown ONLY if user has NO profile) -->
      <div class="card shadow-sm mb-4" id="addProfileCard">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Complete Your Profile</h5>
        </div>
        <div class="card-body">
          <p class="text-muted mb-3">You don't have a profile on file yet. Please provide your contact details below.</p>
          <form id="ProfileForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="customerPhone" class="form-label">Phone Number</label>
                <input
                  type="tel"
                  class="form-control"
                  id="customerPhone"
                  placeholder="e.g. 12345678"
                  required
                />
              </div>
              <div class="col-md-4">
                <label for="customerAddress" class="form-label">Address</label>
                <input
                  type="text"
                  class="form-control"
                  id="customerAddress"
                  placeholder="House number, street, city"
                  required
                />
              </div>
              <div class="col-md-4">
                <label for="DateOfBirth" class="form-label">Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  id="DateOfBirth"
                  required
                />
              </div>
            </div>
            <button type="submit" class="btn btn-success mt-3">
              Save Profile
            </button>
          </form>
        </div>
      </div>

      <!-- 2. Display Profile Details (Shown ONLY if user HAS a profile) -->
      <div class="card shadow-sm mb-4" id="myProfileCard" style="display: none">
        <div
          class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">My Customer Profile</h5>
          <button
            type="button"
            onclick="openEditMyProfileModal()"
            class="btn btn-sm btn-warning"
          >
            Edit Profile
          </button>
        </div>
        <div class="card-body" id="myProfileDetails">
          <!-- Dynamically populated via JS -->
        </div>
      </div>

      <!-- 3. Customer Profiles List (Visible ONLY to Admin / Pharmacist) -->
      <div class="card shadow-sm" id="profileListCard" style="display: none">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Customer Profiles Directory (Admin View)</h5>
          <button onclick="getAllProfiles()" class="btn btn-sm btn-light">
            Refresh
          </button>
        </div>
        <div class="card-body">
          <!-- Search & Filter Controls -->
          <div class="row mb-3">
            <div class="col-md-5 d-flex gap-2">
              <input
                type="number"
                id="searchUserIdInput"
                class="form-control"
                placeholder="Filter by User ID..."
              />
              <button
                type="button"
                onclick="searchByUserId()"
                class="btn btn-outline-secondary"
              >
                Search
              </button>
              <button
                type="button"
                onclick="clearUserIdFilter()"
                class="btn btn-outline-danger"
              >
                Clear
              </button>
            </div>
          </div>

          <!-- Table -->
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Profile ID</th>
                  <th>User Name</th>
                  <th>User ID</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>Date of Birth</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ProfileTable">
                <!-- Populated dynamically via customer_profiles.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- View Profile Modal -->
    <div
      class="modal fade"
      id="viewProfileModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title">Customer Profile Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="viewProfileBody">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div
      class="modal fade"
      id="editProfileModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title">Edit Customer Profile</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="editProfileForm">
            <div class="modal-body">
              <input type="hidden" id="editProfileId" />
              <div class="mb-3">
                <label for="editCustomerPhone" class="form-label">Phone</label>
                <input
                  type="tel"
                  class="form-control"
                  id="editCustomerPhone"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editCustomerAddress" class="form-label"
                  >Address</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="editCustomerAddress"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editDateOfBirth" class="form-label"
                  >Date of Birth</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="editDateOfBirth"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="customer_profiles.js"></script>
  </body>
</html>
