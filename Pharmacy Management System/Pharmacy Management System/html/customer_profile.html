<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile - Pharmacy System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Custom CSS file -->
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main -->
    <main class="container my-5">
      <h2 class="mb-4 text-primary">Customer Profile</h2>
      
      <!-- Add New Customer Profile -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Add new profile</h5>
        </div>

        <div class="card-body">
          <form id="AddProfileForm">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="customerPhone" class="form-label">Phone</label>
                <input
                  type="phone"
                  class="form-control"
                  id="customerPhone"
                  placeholder="0000-0000"
                  required
                />
              </div>

              <div class="col-md-3">
                <label for="customerAddress" class="form-label">Address</label>
                <input
                  type="address"
                  class="form-control"
                  id="customerAddress"
                  placeholder="house number and street name"
                  required
                />
              </div>

              <div class="col-md-3">
                <label for="DateOfBirth" class="form-label">Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  id="DateOfBirth"
                  placeholder="mm/dd/yyyy"
                  required
                />
              </div>

            <button type="submit" class="btn btn-success mt-3"> Add </button>
          </form>
        </div>
      </div>

      <!-- Display recorded profiles -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Customer profile List</h5>
          <button class="btn btn-sm btn-light">Refresh</button>
        </div>
        <div class="card-body">

          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Phone</th>
                <th>Adrees</th>
                <th>Date of Birth</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>

            <tbody id="customerProfileTable">
              <tr>
                <td>1</td>
                <td>94328843</td>
                <td>1234 muscat</td>
                <td>12/09/2000</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-warning me-1">Edit</button>
                  <button class="btn btn-sm btn-danger">Delete</button>
                </td>
              </tr>

              <tr>
                <td>2</td>
                <td>94455643</td>
                <td>1534 nizwa</td>
                <td>04/18/2001</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-warning me-1">Edit</button>
                  <button class="btn btn-sm btn-danger">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </main>


    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Component Loader Script -->
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
