<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medicine Categories - Pharmacy MS</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
      <!-- Page Header & Action Controls -->
      <div class="row align-items-center mb-4">
        <div class="col-md-6">
          <h2 class="fw-bold text-primary mb-0">Medicine Categories</h2>
          <p class="text-muted small mb-0">
            Manage medicine classifications and therapeutic categories
          </p>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
          <button
            class="btn btn-success shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#addCategoryModal"
          >
            + Add New Category
          </button>
        </div>
      </div>

      <!-- Search Controls Card -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
          <div class="row g-2">
            <div class="col-md-4">
              <select id="searchType" class="form-select">
                <option value="client">Client-side Search (Fast)</option>
                <option value="name">API Search by Name</option>
                <option value="description">API Search by Description</option>
              </select>
            </div>
            <div class="col-md-8">
              <div class="input-group">
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search categories..."
                />
                <button class="btn btn-primary" id="searchBtn">Search</button>
                <button class="btn btn-outline-secondary" id="clearSearchBtn" onclick="clearCategorySearch()">Clear</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Table Card -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col" style="width: 10%">ID</th>
                  <th scope="col" style="width: 25%">Category Name</th>
                  <th scope="col" style="width: 40%">Description</th>
                  <th scope="col" class="text-center" style="width: 25%">
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody id="categoriesTableBody">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ADD CATEGORY MODAL -->
    <div
      class="modal fade"
      id="addCategoryModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold">Add Medicine Category</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="addCategoryForm">
            <div class="modal-body p-4">
              <div class="mb-3">
                <label for="categoryName" class="form-label fw-bold"
                  >Category Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  id="categoryName"
                  class="form-control"
                  placeholder="e.g., Antibiotics"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="categoryDescription" class="form-label fw-bold"
                  >Description</label
                >
                <textarea
                  id="categoryDescription"
                  class="form-control"
                  rows="3"
                  placeholder="Brief description..."
                  required
                ></textarea>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-success">
                Save Category
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- EDIT CATEGORY MODAL -->
    <div
      class="modal fade"
      id="editCategoryModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title fw-bold">Edit Medicine Category</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="editCategoryForm">
            <div class="modal-body p-4">
              <input type="hidden" id="editCategoryId" />
              <div class="mb-3">
                <label for="editCategoryName" class="form-label fw-bold"
                  >Category Name <span class="text-danger">*</span></label
                >
                <div class="input-group">
                  <input
                    type="text"
                    id="editCategoryName"
                    class="form-control"
                    required
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="patchCategoryName()"
                  >
                    Patch Name Only
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <label for="editCategoryDescription" class="form-label fw-bold"
                  >Description</label
                >
                <textarea
                  id="editCategoryDescription"
                  class="form-control"
                  rows="3"
                  required
                ></textarea>
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm mt-2"
                  onclick="patchCategoryDescription()"
                >
                  Patch Description Only
                </button>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-warning">
                Update Full Category
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- DETAILS CATEGORY MODAL -->
    <div
      class="modal fade"
      id="categoryDetailsModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title fw-bold">Category Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <p><strong>ID:</strong> <span id="detailCategoryId"></span></p>
            <p><strong>Name:</strong> <span id="detailCategoryName"></span></p>
            <p>
              <strong>Description:</strong>
              <span id="detailCategoryDescription"></span>
            </p>
          </div>
          <div class="modal-footer bg-light">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS, API, Navbar, Page Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="MedicineCategory.js"></script>
  </body>
</html>
