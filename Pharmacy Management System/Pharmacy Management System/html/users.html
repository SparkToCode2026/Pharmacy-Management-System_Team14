<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Pharmacy System</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Area -->
    <main class="container my-5">
      <h2 class="mb-4 text-primary">User Management</h2>

      <!-- Register New User Form Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Register New User</h5>
        </div>
        <div class="card-body">
          <form id="addUserForm">
            <div class="row g-3">
              <!-- Username -->
              <div class="col-md-3">
                <label for="userName" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="userName"
                  placeholder="Enter username"
                  required
                />
              </div>

              <!-- Email -->
              <div class="col-md-3">
                <label for="userEmail" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="userEmail"
                  placeholder="name@example.com"
                  required
                />
              </div>

              <!-- Password -->
              <div class="col-md-3">
                <label for="userPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="userPassword"
                  placeholder="Enter password"
                  required
                />
              </div>

              <!-- Role -->
              <div class="col-md-3">
                <label for="userRole" class="form-label">Role</label>
                <select class="form-select" id="userRole" required>
                  <option value="" selected disabled>Select role...</option>
                  <option value="Admin">Admin</option>
                  <option value="Pharmacist">Pharmacist</option>
                  <option value="User">User</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-success mt-3">Add User</button>
          </form>
        </div>
      </div>

      <!-- Registered Users Table Card -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Registered Users</h5>
          <div class="d-flex gap-2">
            <button
              id="sortBtn"
              onclick="sortUsersById()"
              class="btn btn-sm btn-light"
            >
              Sort by ID
            </button>
            <button onclick="loadUsers()" class="btn btn-sm btn-light">
              Refresh
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Search Control -->
          <div class="row mb-3">
            <div class="col-md-4 ms-auto">
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by username or email..."
              />
            </div>
          </div>

          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Edit User Modal -->
    <div
      class="modal fade"
      id="editUserModal"
      tabindex="-1"
      aria-labelledby="editUserModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="editUserForm">
            <div class="modal-body">
              <input type="hidden" id="editUserId" />

              <div class="mb-3">
                <label for="editUserName" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="editUserName"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editUserEmail" class="form-label"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="editUserEmail"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editUserRole" class="form-label">Role</label>
                <select class="form-select" id="editUserRole" required>
                  <option value="Admin">Admin</option>
                  <option value="Pharmacist">Pharmacist</option>
                  <option value="User">User</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Update Password Modal -->
    <div
      class="modal fade"
      id="updatePasswordModal"
      tabindex="-1"
      aria-labelledby="updatePasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title" id="updatePasswordModalLabel">
              Update Password
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="updatePasswordForm">
            <div class="modal-body">
              <input type="hidden" id="pwdUserId" />
              <div class="mb-3">
                <label for="newPasswordInput" class="form-label"
                  >New Password</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="newPasswordInput"
                  placeholder="Enter new password"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-dark">
                Update Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- User Details Modal -->
    <div
      class="modal fade"
      id="userDetailsModal"
      tabindex="-1"
      aria-labelledby="userDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title" id="userDetailsModalLabel">User Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>User ID:</strong> <span id="detailUserId"></span></p>
            <p><strong>Username:</strong> <span id="detailUsername"></span></p>
            <p><strong>Email:</strong> <span id="detailEmail"></span></p>
            <p><strong>Role ID:</strong> <span id="detailRoleId"></span></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Component Loader Script -->
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>

    <!-- Bootstrap JS & User.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="User.js"></script>
  </body>
</html>
