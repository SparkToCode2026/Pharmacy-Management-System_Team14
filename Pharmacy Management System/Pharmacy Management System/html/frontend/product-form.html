<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">&larr; Back to Products</a>
  </div>
</nav>

<main class="container py-4">
  <!-- product-form.js sets this to "Add New Product" or "Edit Product" -->
  <h1 id="formHeading" class="mb-4">Add New Product</h1>

  <form id="productForm" class="col-12 col-md-8">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" rows="3"></textarea>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" min="0" class="form-control" id="price" required>
      </div>
      <div class="col-6 mb-3">
        <label for="stock" class="form-label">Stock</label>
        <input type="number" min="0" class="form-control" id="stock" required>
      </div>
    </div>

    <div class="mb-3">
      <label for="imageUrl" class="form-label">Image URL</label>
      <input type="url" class="form-control" id="imageUrl" placeholder="https://...">
    </div>

    <button type="submit" class="btn btn-primary">Save Product</button>
  </form>
</main>

<script src="js/api.js"></script>
<script src="js/product-form.js"></script>
</body>
</html>
