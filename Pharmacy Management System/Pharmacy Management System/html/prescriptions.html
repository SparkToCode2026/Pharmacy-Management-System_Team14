<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prescription Management - Pharmacy System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Dynamic Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <main class="container my-5">
      <h2 class="mb-4 text-primary">Prescription Management</h2>

      <!-- Add Prescription -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Register New Prescription</h5>
        </div>
        <div class="card-body">
          <form id="addPrescriptionForm">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-bold">Doctor Name <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  id="prescriptionDoctorName"
                  placeholder="e.g. Dr. John Smith"
                  required
                />
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">Prescription Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  class="form-control"
                  id="prescriptionDate"
                  required
                />
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">Dosage <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  id="prescriptionDosage"
                  placeholder="e.g. 500mg twice daily"
                  required
                />
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">Duration <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  id="prescriptionDuration"
                  placeholder="e.g. 7 Days"
                  required
                />
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                <select class="form-select" id="prescriptionStatus" required>
                  <option value="Pending" selected>Pending</option>
                  <option value="Approved">Approved</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">User <span class="text-danger">*</span></label>
                <select class="form-select" id="userId" required>
                  <option value="" disabled selected>Select a user...</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-success mt-3 px-4">
              Add Prescription
            </button>
          </form>
        </div>
      </div>

      <!-- Prescription Table -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <h5 class="card-title mb-0">Registered Prescriptions</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-light" id="sortPrescriptionsBtn" onclick="sortPrescriptionsAction()">
              Sort Prescriptions
            </button>
            <button class="btn btn-sm btn-light" onclick="getAllPrescriptions()">
              Refresh
            </button>
          </div>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Doctor Name</th>
                  <th>Date</th>
                  <th>Dosage</th>
                  <th>Duration</th>
                  <th>Status</th>
                  <th>User ID</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="prescriptionsTableBody">
                <tr>
                  <td colspan="8" class="text-center">
                    Loading prescriptions...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Edit Prescription Modal -->
    <div class="modal fade" id="editPrescriptionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title fw-bold">Edit Prescription</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <form id="editPrescriptionForm">
            <div class="modal-body">
              <input type="hidden" id="editPrescriptionId" />

              <div class="mb-3">
                <label class="form-label fw-bold">Doctor Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="editDoctorName"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Prescription Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="editDate"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Dosage</label>
                <input
                  type="text"
                  class="form-control"
                  id="editDosage"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Duration</label>
                <input
                  type="text"
                  class="form-control"
                  id="editDuration"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Status</label>
                <select class="form-select" id="editStatus">
                  <option value="Pending">Pending</option>
                  <option value="Approved">Approved</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">User <span class="text-danger">*</span></label>
                <select class="form-select" id="editUserId" required>
                  <option value="" disabled selected>Select a user...</option>
                </select>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS, API, Navbar, Prescription JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="prescription.js"></script>
  </body>
</html>
