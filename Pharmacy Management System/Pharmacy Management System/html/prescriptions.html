<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <title>Prescription Management - Pharmacy System</title>


  <!-- Bootstrap 5 CSS -->
  <link 
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
  rel="stylesheet">


  <!-- Custom CSS -->
  <link href="style.css" rel="stylesheet">


</head>



<body>


<!-- Navigation Bar Placeholder -->

<div id="navbar-placeholder"></div>




<main class="container my-5">


<h2 class="mb-4 text-primary">
  Prescription Management
</h2>





<!-- Register New Prescription Card -->


<div class="card mb-4 shadow-sm">


<div class="card-header bg-primary text-white">

<h5 class="card-title mb-0">
  Register New Prescription
</h5>

</div>




<div class="card-body">


<form id="addPrescriptionForm">


<div class="row g-3">





<!-- Doctor Name -->

<div class="col-md-3">

<label for="prescriptionDoctorName" class="form-label">
Doctor Name
</label>


<input
type="text"
class="form-control"
id="prescriptionDoctorName"
placeholder="Enter doctor name"
required>


</div>





<!-- Date -->

<div class="col-md-3">

<label for="prescriptionDate" class="form-label">
Prescription Date
</label>


<input
type="date"
class="form-control"
id="prescriptionDate"
required>


</div>





<!-- Dosage -->

<div class="col-md-3">

<label for="prescriptionDosage" class="form-label">
Dosage
</label>


<input
type="text"
class="form-control"
id="prescriptionDosage"
placeholder="Enter dosage"
required>


</div>





<!-- Duration -->

<div class="col-md-3">

<label for="prescriptionDuration" class="form-label">
Duration
</label>


<input
type="text"
class="form-control"
id="prescriptionDuration"
placeholder="Example: 7 Days"
required>


</div>





<!-- Status -->

<div class="col-md-3">

<label for="prescriptionStatus" class="form-label">
Status
</label>


<select
class="form-select"
id="prescriptionStatus"
required>


<option selected disabled>
Select status...
</option>


<option>
Pending
</option>


<option>
Approved
</option>


<option>
Completed
</option>


</select>


</div>





<!-- User ID -->

<div class="col-md-3">

<label for="userId" class="form-label">
User ID
</label>


<input
type="number"
class="form-control"
id="userId"
placeholder="Enter User ID"
required>


</div>




</div>





<button
type="submit"
class="btn btn-success mt-3">

Add Prescription

</button>



</form>


</div>


</div>







<!-- Registered Prescriptions Card -->


<div class="card shadow-sm">



<div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">


<h5 class="card-title mb-0">

Registered Prescriptions

</h5>



<button class="btn btn-sm btn-light">

Refresh

</button>



</div>






<div class="card-body">


<table class="table table-striped table-hover align-middle">



<thead>


<tr>

<th>ID</th>

<th>Doctor Name</th>

<th>Date</th>

<th>Dosage</th>

<th>Duration</th>

<th>Status</th>

<th>User ID</th>

<th class="text-center">
Actions
</th>


</tr>


</thead>






<tbody>



<tr>


<td>1</td>

<td>Dr. Ahmed</td>

<td>2026-08-01</td>

<td>500mg</td>

<td>7 Days</td>

<td>Approved</td>

<td>2</td>



<td class="text-center">


<button class="btn btn-sm btn-warning me-1">

Edit

</button>



<button class="btn btn-sm btn-danger">

Delete

</button>



</td>


</tr>





<tr>


<td>2</td>

<td>Dr. Ali</td>

<td>2026-08-05</td>

<td>250mg</td>

<td>5 Days</td>

<td>Pending</td>

<td>1</td>



<td class="text-center">


<button class="btn btn-sm btn-warning me-1">

Edit

</button>



<button class="btn btn-sm btn-danger">

Delete

</button>



</td>


</tr>




</tbody>



</table>


</div>



</div>





</main>







<!-- Footer Placeholder -->


<div id="footer-placeholder"></div>







<!-- Shared Component Loader -->


<script>


fetch("navbar.html")

.then(response => response.text())

.then(data => {

document.getElementById("navbar-placeholder").innerHTML = data;

});





fetch("footer.html")

.then(response => response.text())

.then(data => {

document.getElementById("footer-placeholder").innerHTML = data;

});



</script>




</body>

</html>
