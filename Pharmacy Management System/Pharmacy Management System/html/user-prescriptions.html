<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Prescriptions - Pharmacy Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Dynamic Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
      <div class="row mb-4">
        <div class="col-12">
          <h2 class="text-primary fw-bold">My Prescriptions</h2>
          <p class="text-muted">
            Track your medical prescriptions, prescribed dosages, and approval statuses
          </p>
        </div>
      </div>

      <!-- Prescriptions Table Card -->
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Your Prescriptions Record</h5>
          <button class="btn btn-sm btn-light" onclick="loadUserPrescriptions()">Refresh</button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="prescriptionsTable">
              <thead class="table-dark">
                <tr>
                  <th>Prescription ID</th>
                  <th>Doctor Name</th>
                  <th>Dosage</th>
                  <th>Duration</th>
                  <th>Status</th>
                  <th>Date Issued</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody id="prescriptionsTableBody">
                <tr>
                  <td colspan="7" class="text-center text-muted py-4">
                    Loading prescriptions...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Prescription Details Modal -->
    <div class="modal fade" id="prescriptionDetailsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title fw-bold">Prescription Details</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="prescriptionDetailsBody">
            <!-- Populated via JS -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS, API, Navbar, User Prescriptions JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="user-prescriptions.js"></script>
  </body>
</html>
