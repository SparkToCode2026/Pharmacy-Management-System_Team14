<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Levels - Pharmacy Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <div id="navbar-placeholder"></div>

    <main class="main-content mt-4">
      <div class="container">
        <!-- Create Stock Level Card -->
        <div class="card mb-4 shadow-sm">
          <div class="card-header bg-primary text-white">
            <h3 class="mb-0 fs-4">Add New Stock Level</h3>
          </div>
          <div class="card-body">
            <form id="stockLevelForm">
              <div class="row g-3">
                <div class="col-md-4">
                  <label for="currentQuantity" class="form-label"
                    >Current Quantity</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="currentQuantity"
                    placeholder="150"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label for="reorderLevel" class="form-label"
                    >Reorder Level</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="reorderLevel"
                    placeholder="20"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label for="lastRestockedDate" class="form-label"
                    >Last Restocked Date</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="lastRestockedDate"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="medicineId" class="form-label">Medicine ID</label>
                  <input
                    type="number"
                    class="form-control"
                    id="medicineId"
                    placeholder="5"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="branchId" class="form-label">Branch ID</label>
                  <input
                    type="number"
                    class="form-control"
                    id="branchId"
                    placeholder="2"
                    required
                  />
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4">
                Add Stock Level
              </button>
            </form>
          </div>
        </div>

        <!-- Stock Level Table Card -->
        <div class="card mb-5 shadow-sm">
          <div
            class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
          >
            <h3 class="mb-0 fs-4">Stock Level List</h3>
            <button
              type="button"
              class="btn btn-light btn-sm"
              id="refreshStockLevels"
            >
              Refresh
            </button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Current Qty</th>
                    <th>Reorder Level</th>
                    <th>Last Restocked Date</th>
                    <th>Medicine ID</th>
                    <th>Branch ID</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>
                <tbody id="stockLevelTableBody">
                  <tr>
                    <td colspan="7" class="text-center">
                      Loading stock levels...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Edit Stock Level Modal -->
    <div
      class="modal fade"
      id="editStockLevelModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editStockLevelForm">
            <div class="modal-header bg-warning text-dark">
              <h5 class="modal-title">Edit Stock Level</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editStockLevelId" />
              <div class="mb-3">
                <label for="editCurrentQuantity" class="form-label"
                  >Current Quantity</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="editCurrentQuantity"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editReorderLevel" class="form-label"
                  >Reorder Level</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="editReorderLevel"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        });
    </script>
    <script src="StockLevel.js"></script>
    <script src="navbar.js"></script>
  </body>
</html>
