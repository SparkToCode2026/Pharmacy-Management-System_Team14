<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Levels - Pharmacy Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div class="container">

      <div class="card mb-4">
        <div class="card-header">
          <h3 class="mb-0">Add New Stock Level</h3>
        </div>
        <div class="card-body">
          <form id="stockLevelForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="currentQuantity" class="form-label">Current Quantity</label>
                <input type="number" class="form-control" id="currentQuantity" placeholder="e.g. 150">
              </div>
              <div class="col-md-4">
                <label for="reorderLevel" class="form-label">Reorder Level</label>
                <input type="number" class="form-control" id="reorderLevel" placeholder="e.g. 20">
              </div>
              <div class="col-md-4">
                <label for="lastRestockedDate" class="form-label">Last Restocked Date</label>
                <input type="date" class="form-control" id="lastRestockedDate">
              </div>
              <div class="col-md-6">
                <label for="medicineId" class="form-label">Medicine ID</label>
                <input type="number" class="form-control" id="medicineId" placeholder="e.g. 5">
              </div>
              <div class="col-md-6">
                <label for="branchId" class="form-label">Branch ID</label>
                <input type="number" class="form-control" id="branchId" placeholder="e.g. 2">
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Add Stock Level</button>
          </form>
        </div>
      </div>

      <div class="card mb-5">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Stock Level List</h3>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshStockLevels">Refresh</button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>Stock Level ID</th>
                  <th>Current Quantity</th>
                  <th>Reorder Level</th>
                  <th>Last Restocked Date</th>
                  <th>Medicine ID</th>
                  <th>Branch ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="stockLevelTableBody">
                <tr>
                  <td>1</td>
                  <td>150</td>
                  <td>20</td>
                  <td>2026-07-30</td>
                  <td>5</td>
                  <td>2</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
                <tr class="table-warning">
                  <td>2</td>
                  <td>8</td>
                  <td>15</td>
                  <td>2026-08-02</td>
                  <td>9</td>
                  <td>1</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
                <tr>
                  <td>3</td>
                  <td>60</td>
                  <td>25</td>
                  <td>2026-07-25</td>
                  <td>3</td>
                  <td>3</td>
                  <td>
                    <button type="button" class="btn btn-warning btn-sm">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <div class="modal fade" id="editStockLevelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editStockLevelForm">
          <div class="modal-header">
            <h5 class="modal-title">Edit Stock Level</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editStockLevelId">
            <div class="mb-3">
              <label for="editCurrentQuantity" class="form-label">Current Quantity</label>
              <input type="number" class="form-control" id="editCurrentQuantity">
            </div>
            <div class="mb-3">
              <label for="editReorderLevel" class="form-label">Reorder Level</label>
              <input type="number" class="form-control" id="editReorderLevel">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });

    fetch('footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="StockLevel.js"></script>

</body>
</html>
