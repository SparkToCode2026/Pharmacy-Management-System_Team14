<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Levels - Pharmacy Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Dynamic Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <main class="container my-5">
      <h2 class="mb-4 text-primary">Stock & Inventory Management</h2>

      <!-- Create Stock Level Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Add New Stock Record</h5>
        </div>
        <div class="card-body">
          <form id="stockLevelForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="currentQuantity" class="form-label fw-bold">Current Quantity <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  id="currentQuantity"
                  placeholder="e.g. 150"
                  min="0"
                  required
                />
              </div>
              <div class="col-md-4">
                <label for="reorderLevel" class="form-label fw-bold">Reorder Alert Level <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  id="reorderLevel"
                  placeholder="e.g. 20"
                  min="1"
                  required
                />
              </div>
              <div class="col-md-4">
                <label for="lastRestockedDate" class="form-label fw-bold">Last Restocked Date <span class="text-danger">*</span></label>
                <input
                  type="date"
                  class="form-control"
                  id="lastRestockedDate"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="medicineId" class="form-label fw-bold">Medicine ID <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  id="medicineId"
                  placeholder="e.g. 1"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="branchId" class="form-label fw-bold">Branch ID <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  id="branchId"
                  placeholder="e.g. 1"
                  required
                />
              </div>
            </div>
            <button type="submit" class="btn btn-success mt-4 px-4">
              Add Stock Record
            </button>
          </form>
        </div>
      </div>

      <!-- Stock Level Table Card -->
      <div class="card mb-5 shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <h5 class="card-title mb-0">Stock Levels by Branch</h5>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-sm btn-warning text-dark" id="showLowStockBtn" onclick="toggleLowStock()">
              Show Low Stock Only
            </button>
            <button
              type="button"
              class="btn btn-light btn-sm"
              id="refreshStockLevels"
            >
              Refresh
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Current Qty</th>
                  <th>Reorder Level</th>
                  <th>Last Restocked Date</th>
                  <th>Medicine ID</th>
                  <th>Branch ID</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="stockLevelTableBody">
                <tr>
                  <td colspan="7" class="text-center">
                    Loading stock levels...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Edit Stock Level Modal -->
    <div
      class="modal fade"
      id="editStockLevelModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editStockLevelForm">
            <div class="modal-header bg-warning text-dark">
              <h5 class="modal-title fw-bold">Edit Stock Level</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editStockLevelId" />
              <div class="mb-3">
                <label for="editCurrentQuantity" class="form-label fw-bold">Current Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  id="editCurrentQuantity"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="editReorderLevel" class="form-label fw-bold">Reorder Level</label>
                <input
                  type="number"
                  class="form-control"
                  id="editReorderLevel"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="navbar.js"></script>
    <script src="stocklevel.js"></script>
  </body>
</html>
