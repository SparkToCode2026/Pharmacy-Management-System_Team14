<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile - Pharmacy Management System</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Custom CSS file -->
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main -->
    <main class="container my-5">
      <h2 class="mb-4 text-primary">Branch Management</h2>
      
      <!-- Add New Branch -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Add new branch</h5>
        </div>
        <div class="card-body">
          <form id="branchForm">
            <div class="row g-3">
              <div class="col-md-3">
                <label for="BranchName" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="BranchName"
                  placeholder="Enter branch name"
                  required
                />
              </div>
              <div class="col-md-3">
                <label for="BranchAddress" class="form-label">Address</label>
                <input
                  type="address"
                  class="form-control"
                  id="BranchAddress"
                  placeholder="branch location"
                  required
                />
              </div>
              <div class="col-md-3">
                <label for="BranchCity" class="form-label">City</label>
                <input
                  type="text"
                  class="form-control"
                  id="BranchCity"
                  placeholder="Enter branch city"
                  required
                />
              </div>
              <div class="col-md-3">
                <label for="BranchPhone" class="form-label">Phone</label>
                <input
                  type="tel"
                  inputmode="numeric"
                  class="form-control"
                  id="BranchPhone"
                  placeholder="0000 0000"
                  required
                />
              </div>
            </div>  
            <button type="submit" class="btn btn-success mt-3"> Add branch </button>
          </form>
        </div>
      </div>

      <!-- Display Branches -->
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Branches List</h5>
          <div class="d-flex gap-2">
            <button onclick="getAllBranches()" class="btn btn-sm btn-light">
              Refresh
            </button>
          </div>
        </div>
        <div class="card-body">

          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Branch Name</th>
                <th>Adrees</th>
                <th>City</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody id="branchesTable">
              <!-- Data will be displayed dynamically here-->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Component Loader Script -->
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        })
        .catch(() => console.log("navbar skipped"));

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        })
        .catch(() => console.log("footer skipped"));
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="branches.js"></script>
  </body>
</html>
