<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medicine Management - Pharmacy System</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Area -->
    <main class="container my-5">
      <h2 class="mb-4 text-primary">Medicine Management</h2>

      <!-- Register New Medicine Form Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="card-title mb-0">Add New Medicine</h5>
        </div>
        <div class="card-body">
          <form id="addMedicineForm">
            <div class="row g-3">
              <!-- Medicine Name -->
              <div class="col-md-4">
                <label for="medicineName" class="form-label">Medicine Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="medicineName"
                  placeholder="Enter medicine name"
                  required
                />
              </div>

              <!-- Price -->
              <div class="col-md-2">
                <label for="medicinePrice" class="form-label">Price ($)</label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  id="medicinePrice"
                  placeholder="0.00"
                  min="0"
                  required
                />
              </div>

              <!-- Category Foreign Key Dropdown -->
              <div class="col-md-3">
                <label for="categorySelect" class="form-label">Category</label>
                <select class="form-select" id="categorySelect" required>
                  <option value="" selected disabled>Select category...</option>
                </select>
              </div>

              <!-- Manufacturer Foreign Key Dropdown -->
              <div class="col-md-3">
                <label for="manufacturerSelect" class="form-label">Manufacturer</label>
                <select class="form-select" id="manufacturerSelect" required>
                  <option value="" selected disabled>Select manufacturer...</option>
                </select>
              </div>

              <!-- Supplier Foreign Key Dropdown -->
              <div class="col-md-4">
                <label for="supplierSelect" class="form-label">Supplier</label>
                <select class="form-select" id="supplierSelect" required>
                  <option value="" selected disabled>Select supplier...</option>
                </select>
              </div>

              <!-- Production Date -->
              <div class="col-md-4">
                <label for="medicineProductionDate" class="form-label">Production Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="medicineProductionDate"
                  required
                />
              </div>

              <!-- Expiry Date -->
              <div class="col-md-4">
                <label for="medicineExpiryDate" class="form-label">Expiry Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="medicineExpiryDate"
                  required
                />
              </div>

              <!-- Description -->
              <div class="col-12">
                <label for="medicineDescription" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="medicineDescription"
                  rows="2"
                  required
                  placeholder="Enter medicine details/dosage information..."
                ></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-success mt-3">Add Medicine</button>
          </form>
        </div>
      </div>

      <!-- Medicine Inventory Table Card -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Medicine Inventory</h5>
          <div class="d-flex gap-2">
            <button
              id="sortBtn"
              onclick="sortMedicinesById()"
              class="btn btn-sm btn-light"
            >
              Sort by ID
            </button>
            <button onclick="loadMedicines()" class="btn btn-sm btn-light">
              Refresh
            </button>
          </div>
        </div>
        <div class="card-body">
          <!-- Search Control -->
          <div class="row mb-3">
            <div class="col-md-4 ms-auto">
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search by name, category, or manufacturer..."
              />
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Price</th>
                  <th>Category</th>
                  <th>Manufacturer</th>
                  <th>Supplier</th>
                  <th>Expiry Date</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="medicinesTableBody">
                <!-- Dynamically populated rows -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Medicine Details Modal -->
    <div
      class="modal fade"
      id="medicineDetailsModal"
      tabindex="-1"
      aria-labelledby="medicineDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title" id="medicineDetailsModalLabel">Medicine Details</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>ID:</strong> <span id="detailId"></span></p>
            <p><strong>Name:</strong> <span id="detailName"></span></p>
            <p><strong>Price:</strong> $<span id="detailPrice"></span></p>
            <p><strong>Category:</strong> <span id="detailCategory"></span></p>
            <p><strong>Manufacturer:</strong> <span id="detailManufacturer"></span></p>
            <p><strong>Supplier:</strong> <span id="detailSupplier"></span></p>
            <p><strong>Production Date:</strong> <span id="detailProductionDate"></span></p>
            <p><strong>Expiry Date:</strong> <span id="detailExpiryDate"></span></p>
            <p><strong>Description:</strong> <span id="detailDescription"></span></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Medicine Modal -->
    <div
      class="modal fade"
      id="editMedicineModal"
      tabindex="-1"
      aria-labelledby="editMedicineModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title" id="editMedicineModalLabel">Edit Medicine</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="editMedicineForm">
            <div class="modal-body">
              <input type="hidden" id="editMedicineId" />

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="editMedicineName" class="form-label">Medicine Name</label>
                  <input type="text" class="form-control" id="editMedicineName" required />
                </div>

                <div class="col-md-6">
                  <label for="editMedicinePrice" class="form-label">Price ($)</label>
                  <input type="number" step="0.01" class="form-control" id="editMedicinePrice" min="0" required />
                </div>

                <div class="col-md-4">
                  <label for="editCategorySelect" class="form-label">Category</label>
                  <select class="form-select" id="editCategorySelect" required></select>
                </div>

                <div class="col-md-4">
                  <label for="editManufacturerSelect" class="form-label">Manufacturer</label>
                  <select class="form-select" id="editManufacturerSelect" required></select>
                </div>

                <div class="col-md-4">
                  <label for="editSupplierSelect" class="form-label">Supplier</label>
                  <select class="form-select" id="editSupplierSelect" required></select>
                </div>

                <div class="col-md-6">
                  <label for="editMedicineProductionDate" class="form-label">Production Date</label>
                  <input type="date" class="form-control" id="editMedicineProductionDate" required />
                </div>

                <div class="col-md-6">
                  <label for="editMedicineExpiryDate" class="form-label">Expiry Date</label>
                  <input type="date" class="form-control" id="editMedicineExpiryDate" required />
                </div>

                <div class="col-12">
                  <label for="editMedicineDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="editMedicineDescription" rows="2" required></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Component Loader Script -->
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        })
        .catch(() => console.log("navbar skipped"));

      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
        })
        .catch(() => console.log("footer skipped"));
    </script>

    <!-- Bootstrap JS & Medicine.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Medicine.js"></script>
  </body>
</html>
